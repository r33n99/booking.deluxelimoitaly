                    LOCAL_PATH: 'dist/*'
                    # SSH_KEY: '<string>' # Optional.
                    #EXTRA_ARGS: ['-r'] # Optional.
                    # DEBUG: '<boolean>' # Optional.
          - step:
              image: node:18.17.0
              name: "Build & Deploy Feature Version RLT"
